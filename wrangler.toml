name = "sa-landing-pages"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# D1: replace database_id after `npx wrangler d1 create shield-db` (not run yet).
[[d1_databases]]
binding = "DB"
database_name = "shield-db"
database_id = "REPLACE_WITH_D1_ID"

# R2: Vault treasury, Shield Bolt snapshots, ephemeral AI images.
# Create the bucket first: `npx wrangler r2 bucket create shield-vault`.
[[r2_buckets]]
binding = "VAULT"
bucket_name = "shield-vault"
