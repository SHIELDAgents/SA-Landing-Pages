<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIELD // Protocols</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Matrix digital rain canvas background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.02),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.02)
            );
            background-size: 100% 3px, 6px 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Main Minimalist Container */
        .container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Header / Brand */
        .brand-header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: clamp(3rem, 6vw, 4.5rem);
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66, 0 0 40px rgba(0, 255, 102, 0.6);
            margin-bottom: 10px;
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
                text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66, 0 0 40px rgba(0, 255, 102, 0.6);
                opacity: 1;
            }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
                text-shadow: none;
                opacity: 0.85;
            }
        }

        .slogan {
            font-size: 1.1rem;
            color: #00cc55;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .subheadline {
            font-size: 0.85rem;
            color: #888888;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 14px;
            opacity: 0.85;
        }

        /* Floating & Swiping Options Carousel / List */
        .options-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            perspective: 1000px;
        }

        .option-item {
            background: rgba(10, 20, 15, 0.6);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 6px;
            padding: 22px 30px;
            font-size: 1.25rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: float 6s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-text {
            position: relative;
            z-index: 2;
        }

        .btn-bg-icon {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            opacity: 0.10;
            color: #00ff66;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .option-item:hover .btn-bg-icon {
            opacity: 0.20;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .option-item:nth-child(1) { animation-delay: 0s; }
        .option-item:nth-child(2) { animation-delay: 2s; }
        .option-item:nth-child(3) { animation-delay: 4s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) translateX(0px);
            }
            50% {
                transform: translateY(-6px) translateX(3px);
            }
        }

        .option-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 255, 102, 0.15),
                transparent
            );
            transition: 0.5s;
        }

        .option-item:hover {
            background: rgba(0, 35, 12, 0.85);
            border-color: #00ff66;
            color: #00ff66;
            transform: scale(1.03) translateX(6px);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.4), inset 0 0 10px rgba(0, 255, 102, 0.2);
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
        }

        .option-item:hover::before {
            left: 100%;
        }

        /* Subtle indicator */
        .option-item::after {
            content: '>';
            position: absolute;
            right: 25px;
            color: #008833;
            transition: 0.3s;
            z-index: 2;
        }

        .option-item:hover::after {
            color: #00ff66;
            transform: translateX(4px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            .option-item {
                font-size: 1rem;
                padding: 18px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <div class="brand-header">
            <h1>SHIELD</h1>
            <div class="slogan">Protocols</div>
            <div class="subheadline">Identity Armor & Leak Defense for Creators</div>
        </div>

        <div class="options-container">
            <div class="option-item" onclick="selectOption('PROTECT MY IP')">
                <svg class="btn-bg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <rect x="9" y="11" width="6" height="5" rx="1"/>
                    <path d="M10 11V9.5a2 2 0 0 1 4 0V11"/>
                </svg>
                <span class="btn-text">Protect my IP</span>
            </div>
            <div class="option-item" onclick="selectOption('DELETE LEAKED CONTENT')">
                <svg class="btn-bg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    <line x1="4" y1="4" x2="20" y2="20"/>
                </svg>
                <span class="btn-text">Delete Leaked Content</span>
            </div>
            <div class="option-item" onclick="selectOption('PRINT MONEY W/ PROTOCOLS')">
                <svg class="btn-bg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                    <path d="M6 9V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5"/>
                    <rect x="6" y="14" width="12" height="8" rx="1"/>
                    <path d="M12 16v4M10.8 17c0-.5.5-.8 1.2-.8s1.2.3 1.2.8c0 1-1.4 1.1-1.4 1.7 0 .5.5.8 1.2.8s1.2-.3 1.2-.8"/>
                </svg>
                <span class="btn-text">Print Money w/ Protocols</span>
            </div>
        </div>
    </div>

    <script>
        // Matrix digital rain background
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+-<>/?\\|';
        const alphabet = katakana + latin;

        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                const x = i * fontSize;
                const y = rainDrops[i] * fontSize;

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        setInterval(drawMatrix, 65);

        function selectOption(optionName) {
            console.log(`Selected: ${optionName}`);
            // Add action redirection or handshake simulation if desired
        }
    </script>
</body>
</html>
