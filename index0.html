<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIELD AP // Anti-Agent Protocol</title>
    <!-- High-Legibility Cyber & Monospace Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --shield-green: #00ff88;      /* ONLY SHIELD title is green & glitching */
            --cyber-blue: #0055aa;         /* Darker, serious, cold cybersecurity blue */
            --cyber-blue-glow: rgba(0, 85, 170, 0.8);
            --ice-blue: #3399ff;          /* Brighter cold blue for visibility */
            --pitch-black: #000000;
            --text-high-contrast: #FFFFFF;
            --silver-gradient: linear-gradient(135deg, #E0E0E0 0%, #FFFFFF 50%, #B0B0B0 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--pitch-black) !important;
            color: var(--text-high-contrast);
            font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Matrix digital rain background canvas - Very dark black background, high visibility characters */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.5; /* Higher opacity for better visibility */
            pointer-events: none;
        }

        /* Cyber scanlines overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.6) 50%
            );
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        /* Hero Main Container */
        .hero-container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 820px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto;
        }

        /* Main Title Header Group */
        .brand-title-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 10px;
        }

        /* SHIELD Title ONLY - Green, Aggressive Glitch, Flicker & Vanishing Attack Effect */
        .title-shield {
            position: relative;
            font-size: clamp(3.2rem, 8.5vw, 5.4rem);
            font-weight: 900;
            letter-spacing: 10px;
            color: var(--shield-green);
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--shield-green), 0 0 45px var(--shield-green);
            animation: shieldAttack 2.2s infinite ease-in-out;
            display: inline-block;
        }

        .title-shield::before,
        .title-shield::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .title-shield::before {
            left: -2px;
            text-shadow: -2px 0 var(--cyber-blue);
            animation: glitchAnim1 1.8s infinite linear alternate-reverse;
        }

        .title-shield::after {
            left: 2px;
            text-shadow: 2px 0 var(--shield-green);
            animation: glitchAnim2 2.5s infinite linear alternate-reverse;
        }

        @keyframes shieldAttack {
            0% { opacity: 1; transform: translate(0, 0); }
            5% { opacity: 0.7; transform: translate(-3px, 1px); }
            6% { opacity: 0.15; transform: translate(4px, -2px); filter: blur(1px); }
            7% { opacity: 0.9; transform: translate(0, 0); filter: none; }
            30% { opacity: 1; transform: translate(0, 0); }
            31% { opacity: 0.05; transform: translate(-6px, 0); } /* Quick vanish flash */
            32% { opacity: 0.85; transform: translate(2px, -1px); }
            33% { opacity: 1; transform: translate(0, 0); }
            65% { opacity: 1; transform: translate(0, 0); }
            66% { opacity: 0.5; transform: translate(3px, 2px); }
            67% { opacity: 0.2; transform: translate(-3px, -1px); }
            68% { opacity: 1; transform: translate(0, 0); }
            95% { opacity: 0.85; transform: translate(0, 0); }
            97% { opacity: 0.08; transform: translate(6px, -1px); } /* Sudden vanish glitch */
            100% { opacity: 1; transform: translate(0, 0); }
        }

        @keyframes glitchAnim1 {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(40px, 9999px, 60px, 0); }
            40% { clip: rect(15px, 9999px, 45px, 0); }
            60% { clip: rect(70px, 9999px, 85px, 0); }
            80% { clip: rect(25px, 9999px, 50px, 0); }
            100% { clip: rect(5px, 9999px, 35px, 0); }
        }

        @keyframes glitchAnim2 {
            0% { clip: rect(50px, 9999px, 80px, 0); }
            25% { clip: rect(10px, 9999px, 25px, 0); }
            50% { clip: rect(65px, 9999px, 90px, 0); }
            75% { clip: rect(30px, 9999px, 55px, 0); }
            100% { clip: rect(20px, 9999px, 40px, 0); }
        }

        /* AP Title - ROCK SOLID Metallic Chrome, Serious Cold Outer Glow, NO Glitch */
        .title-ap {
            font-size: clamp(3.2rem, 8.5vw, 5.4rem);
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #E0E0E0 0%, #FFFFFF 40%, #A0A0A0 70%, #FFFFFF 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            filter: drop-shadow(0 0 25px rgba(0, 136, 255, 0.85)) drop-shadow(0 0 55px rgba(0, 136, 255, 0.5));
            animation: chromeShine 4s linear infinite;
            transform: none !important;
            opacity: 1 !important;
        }

        @keyframes chromeShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Subtitle - Serious Cold Cybersecurity Blue */
        .subtitle {
            font-size: 1rem;
            color: var(--cyber-blue);
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 24px;
            text-shadow: 0 0 14px rgba(0, 136, 255, 0.8);
        }

        /* Main Copy / Tagline Block */
        .tagline-block {
            font-size: 21px;
            line-height: 1.6;
            color: #FFFFFF;
            max-width: 720px;
            margin-bottom: 38px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 20px rgba(0, 0, 0, 0.95), 0 0 35px rgba(0, 0, 0, 1);
            background: rgba(0, 0, 0, 0.88);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid rgba(0, 136, 255, 0.4);
            box-shadow: 0 0 35px rgba(0, 0, 0, 1), 0 0 20px rgba(0, 136, 255, 0.2);
            backdrop-filter: blur(16px);
        }

        /* Button Styling - Cold Dark Cybersecurity Blue */
        .cyber-btn {
            width: 460px;
            min-height: 92px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--cyber-blue);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 1), 0 0 20px rgba(0, 136, 255, 0.3), inset 0 0 15px rgba(0, 136, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .cyber-btn:hover {
            background: rgba(0, 20, 45, 0.95);
            border-color: #33a3ff;
            box-shadow: 0 0 45px rgba(0, 136, 255, 0.6), inset 0 0 25px rgba(0, 136, 255, 0.4);
            transform: translateY(-2px) scale(1.015);
        }

        .btn-svg-icon {
            width: 38px;
            height: 38px;
            color: var(--cyber-blue);
            filter: drop-shadow(0 0 12px rgba(0, 136, 255, 1));
        }

        .btn-line1 { font-size: 16px; color: #E0E0E0; margin-bottom: 4px; }
        .btn-line2 { font-size: 20px; font-weight: 800; color: #FFFFFF; text-shadow: 0 0 12px rgba(0, 136, 255, 0.5); }
        .btn-arrow { color: var(--cyber-blue); font-size: 28px; }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="matrix-canvas"></canvas>

    <main class="hero-container">
        <div class="brand-title-wrap">
            <h1 class="title-shield" data-text="SHIELD">SHIELD</h1>
            <h1 class="title-ap">AP</h1>
        </div>
        <div class="subtitle">ANTI-AGENT PROTOCOL</div>

        <div class="tagline-block">
            <p>AI bots scrape your IP, clone your face, and leak your content in seconds.</p>
            <p>Value your peace. We shield it.</p>
        </div>

        <div class="button-stack">
            <a href="#" class="cyber-btn">
                <div class="btn-icon-wrap"><svg class="btn-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><rect x="9" y="10" width="6" height="5" rx="1" fill="currentColor"/><path d="M10 10V8.5a2 2 0 0 1 4 0V10" stroke-width="2"/></svg></div>
                <div class="btn-content"><div class="btn-line1">Protect my</div><div class="btn-line2">INTELLECTUAL PROPERTY</div></div>
                <div class="btn-arrow">&gt;</div>
            </a>
            <a href="#" class="cyber-btn">
                <div class="btn-icon-wrap"><svg class="btn-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke-width="2.5"/><line x1="8.5" y1="8.5" x2="12.5" y2="12.5" stroke-width="2"/><line x1="12.5" y1="8.5" x2="8.5" y2="12.5" stroke-width="2"/></svg></div>
                <div class="btn-content"><div class="btn-line1">Delete my</div><div class="btn-line2">LEAKED Content</div></div>
                <div class="btn-arrow">&gt;</div>
            </a>
            <a href="#" class="cyber-btn">
                <div class="btn-icon-wrap"><svg class="btn-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="8" width="14" height="8" rx="1.5"/><circle cx="12" cy="12" r="2"/><path d="M5 10C3 8 1 9 1 12c0 2 2 2.5 4 1.5"/><path d="M19 10c2-2 4-1 4 2 0 2-2 2.5-4 1.5"/></svg></div>
                <div class="btn-content"><div class="btn-line1">Print cash</div><div class="btn-line2">w/ PROTOCOLS</div></div>
                <div class="btn-arrow">&gt;</div>
            </a>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let fontSize = 21, columns = 0, drops = [];
        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01010189@#$%&*+-<>/?\\|{}[]';

        function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            columns = Math.floor(window.innerWidth / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) drops[i] = { y: Math.random() * -40, speed: 0.05 + Math.random() * 0.08 };
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.font = `700 ${fontSize}px 'JetBrains Mono', monospace`;
            for (let i = 0; i < drops.length; i++) {
                const drop = drops[i]; const headY = Math.floor(drop.y) * fontSize;
                if (headY > 0 && headY < window.innerHeight + 300) {
                    ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#0055aa'; ctx.shadowBlur = 15;
                    ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), i * fontSize, headY);
                    for (let j = 1; j < 12; j++) {
                        const trailY = headY - (j * fontSize);
                        if (trailY > 0 && trailY < window.innerHeight) {
                            ctx.fillStyle = j < 3 ? '#3399ff' : '#0055aa';
                            ctx.shadowColor = '#0055aa'; ctx.shadowBlur = 5;
                            ctx.fillText(chars.charAt((i + j) % chars.length), i * fontSize, trailY);
                        }
                    }
                }
                drop.y += drop.speed;
                if (drop.y * fontSize > window.innerHeight + 300 && Math.random() > 0.99) drop.y = -5;
            }
            requestAnimationFrame(drawMatrix);
        }
        requestAnimationFrame(drawMatrix);
    </script>
</body>
</html>
